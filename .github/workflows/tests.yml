name: .NET Tests

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  build-and-test:
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          # Package versions live in Directory.Packages.props (Central Package Management) and the
          # shared test packages in tests/Directory.Build.props, so both belong in the key.
          key: nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props', '**/Directory.Build.props') }}
          restore-keys: nuget-

      - name: Restore dependencies
        run: dotnet restore Kaimo_File_Server.slnx

      - name: Build
        run: dotnet build Kaimo_File_Server.slnx --no-restore --configuration Release

      # wwwroot/js is generated from Scripts/*.ts and not checked in, so only a clean
      # checkout shows whether the published web app actually ships the scripts
      # (theme, session handoff/login). Same check as in the Web Dockerfile.
      - name: Verify web scripts are published
        run: |
          dotnet publish src/Kaimo_File_Server.Web/Kaimo_File_Server.Web.csproj --no-build --configuration Release -o publish-web
          grep -q '"Route":"js/session.js"' publish-web/Kaimo_File_Server.Web.staticwebassets.endpoints.json
          test -f publish-web/wwwroot/js/themeInit.js

      - name: Test
        # Runs every test project in tests/ (Core, Infrastructure, Search, SmbBridge, Web; the
        # helper library Tests.Common has no tests) as separate processes in parallel. The step
        # fails if any project fails. Each project writes its own .trx (same-second names get a
        # [n] suffix). Coverage uses the collector bundled with Microsoft.NET.Test.Sdk (no extra
        # package); it also merges the per-project reports into one cobertura file.
        # PostgreSQL tests are skipped here because KAIMO_TEST_PG is not set.
        run: dotnet test Kaimo_File_Server.slnx --no-build --configuration Release --verbosity normal --logger trx --results-directory TestResults --collect:"Code Coverage;Format=cobertura"

      - name: Upload Test Results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-results
          # Only the merged coverage report (TestResults/<guid>/); the per-project copies under
          # TestResults/*/In/ hold the same data again and would roughly double the upload.
          path: |
            TestResults/*.trx
            TestResults/*/*.cobertura.xml
          retention-days: 14
