name: Publish Docker Host Image

on:
  release:
    types: [published]
  # Manual run against any branch/tag (Actions tab → Run workflow).
  workflow_dispatch:

jobs:
  push_to_registry:
    name: Push Docker image to Docker Hub
    runs-on: ubuntu-26.04
    permissions:
      packages: write
      contents: read
      attestations: write
      id-token: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@v6

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 1. Kaimo_File_Server.Host
      - name: Extract metadata (tags, labels) for Docker
        id: meta_host
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: kaimosystem/kaimo_file_server

      - name: Build and push Docker image
        id: push_host
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./src/Kaimo_File_Server.Host/Dockerfile
          push: true
          tags: ${{ steps.meta_host.outputs.tags }}
          labels: ${{ steps.meta_host.outputs.labels }}

      # 2. Kaimo_File_Server.Web
      - name: Extract metadata (tags, labels) for Docker
        id: meta_web
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: kaimosystem/kaimo_file_server.web

      - name: Build and push Docker image
        id: push_web
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./src/Kaimo_File_Server.Web/Dockerfile
          push: true
          tags: ${{ steps.meta_web.outputs.tags }}
          labels: ${{ steps.meta_web.outputs.labels }}

      # 3. Kaimo_File_Server.Samba
      - name: Extract metadata (tags, labels) for Docker
        id: meta_samba
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: kaimosystem/kaimo_file_server.samba

      - name: Build and push Docker image
        id: push_samba
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./src/samba-vfs
          file: ./src/samba-vfs/Dockerfile.vfs
          push: true
          tags: ${{ steps.meta_samba.outputs.tags }}
          labels: ${{ steps.meta_samba.outputs.labels }}

      # 4. Kaimo_File_Server.SambaBridge
      - name: Extract metadata (tags, labels) for Docker
        id: meta_samba_bridge
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: kaimosystem/kaimo_file_server.samba_bridge

      - name: Build and push Docker image
        id: push_samba_bridge
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./src/Kaimo_File_Server.SmbBridge/Dockerfile
          push: true
          tags: ${{ steps.meta_samba_bridge.outputs.tags }}
          labels: ${{ steps.meta_samba_bridge.outputs.labels }}

      # 5. SMB control-plane PKI bootstrap
      - name: Extract metadata (tags, labels) for Docker
        id: meta_samba_pki
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: kaimosystem/kaimo_file_server.samba_pki

      - name: Build and push Docker image
        id: push_samba_pki
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./src/samba-vfs
          file: ./src/samba-vfs/Dockerfile.pki
          push: true
          tags: ${{ steps.meta_samba_pki.outputs.tags }}
          labels: ${{ steps.meta_samba_pki.outputs.labels }}

