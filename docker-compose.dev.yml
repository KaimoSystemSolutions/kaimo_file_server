# LOCAL DEVELOPMENT ONLY: Development environment, demo data and PUBLIC "DevOnly" keys.
# Deliberately not named docker-compose.override.yml, so a plain `docker compose up`
# never picks it up. Visual Studio loads it via docker-compose.dcproj
# (AdditionalComposeFilePaths); on the CLI use
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
# or set COMPOSE_FILE=docker-compose.yml:docker-compose.dev.yml in your local .env
# (use ";" instead of ":" as separator on Windows).
services:
  kaimo_file_server.host:
    environment:
      DOTNET_ENVIRONMENT: Development
      Seed__DemoData: "true"
      #Seed__AdminPassword: admin12345
      NtHash__EncryptionKey: ${NT_HASH_ENCRYPTION_KEY:-DevOnly-LocalDevelopment-DoNotUseInProduction-NtHashKey}
    volumes:
      - ${APPDATA:-./tests/data/user-secrets}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA:-./tests/data/user-secrets}/Microsoft/UserSecrets:/root/.microsoft/usersecrets:ro

  kaimo_smb_bridge:
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Seed__DemoData: "true"
      #Seed__AdminPassword: admin12345
      NtHash__EncryptionKey: ${NT_HASH_ENCRYPTION_KEY:-DevOnly-LocalDevelopment-DoNotUseInProduction-NtHashKey}

  kaimo_file_server.web:
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      #KAIMO_DEMO_READONLY: "true"
      Seed__DemoData: "true"
      #Seed__AdminPassword: admin12345
      Jwt__Secret: ${JWT_SECRET:-DevOnly-LocalDevelopment-DoNotUseInProduction-JwtSecret}
      NtHash__EncryptionKey: ${NT_HASH_ENCRYPTION_KEY:-DevOnly-LocalDevelopment-DoNotUseInProduction-NtHashKey}
    volumes:
      - ${APPDATA:-./tests/data/user-secrets}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA:-./tests/data/user-secrets}/Microsoft/UserSecrets:/root/.microsoft/usersecrets:ro
