services:
  kaimo_file_server.host:
    environment:
      - DOTNET_ENVIRONMENT=Development
      # Dev-only key. MUST match the web service (host reads, web writes). Set a real, random
      # NtHash__EncryptionKey via env in production.
      - NtHash__EncryptionKey=DevOnly-LocalDevelopment-DoNotUseInProduction-NtHashKey
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA}/Microsoft/UserSecrets:/root/.microsoft/usersecrets:ro

  kaimo_smb_bridge:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      # MUSS mit Host/Web uebereinstimmen, sonst koennen verschluesselte
      # NT-Hashes nicht entschluesselt werden.
      - NtHash__EncryptionKey=DevOnly-LocalDevelopment-DoNotUseInProduction-NtHashKey

  kaimo_file_server.web:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      # Dev-only key. MUST match the host service (host reads, web writes). Set a real, random
      # NtHash__EncryptionKey via env in production.
      - NtHash__EncryptionKey=DevOnly-LocalDevelopment-DoNotUseInProduction-NtHashKey
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA}/Microsoft/UserSecrets:/root/.microsoft/usersecrets:ro