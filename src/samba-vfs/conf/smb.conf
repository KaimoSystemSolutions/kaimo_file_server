[global]
    workgroup = WORKGROUP
    server string = Kaimo Samba Spike
    server role = standalone server
    map to guest = never
    # Block anonymous/null sessions outright. `map to guest = never` only stops
    # bad-credential logins from falling back to guest; it does NOT stop a true
    # null session (empty user AND password) from binding to IPC$ and enumerating
    # share names pre-auth. Share authorization lives in the VFS (AuthorizeConnect),
    # not in Samba share ACLs, so `access based share enum` has nothing to filter
    # for an anonymous caller. The app has no guest/anonymous use case.
    restrict anonymous = 2
    log level = 2
    logging = stdout

    # --- Phase-0 core: dynamic shares from registry (net conf) ---
    # smbd reads shares live from registry.tdb -> create/remove without reload/restart.
    # Later replaces the FileSystemWatcher/SyncFromDb mechanism from SmbServer.cs.
    registry shares = yes
    include = registry

    # Enforce SMB2/3 (no SMB1) - as in the existing SmbProtocolSettings config.
    server min protocol = SMB2_10

    # For future ABE visibility (risk 2, option a/c):
    access based share enum = yes
