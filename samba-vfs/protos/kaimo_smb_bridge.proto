syntax = "proto3";

// Shared contract between the .NET Control Plane (server) and the
// Samba container (C++ client). Both C# and C++ stubs are generated
// from this single file.
package kaimo.smb.bridge.v1;

option csharp_namespace = "Kaimo_File_Server.SmbBridge.Grpc";

// Auth portion of the Control Plane. The source of truth remains the Kaimo DB
// (IAuthenticationLookup); Samba receives only the NT-Hashes for local
// NTLMv2 verification.
service AuthService {
  // Single retrieval of NT-Hash (for a future On-Demand pdb module).
  rpc GetNtHash(GetNtHashRequest) returns (GetNtHashReply);

  // All active users + NT-Hash for tdbsam sync (Phase 1).
  rpc ListUsers(ListUsersRequest) returns (ListUsersReply);
}

message GetNtHashRequest {
  string username = 1;
}

message GetNtHashReply {
  bool  found   = 1;
  bytes nt_hash = 2; // raw 16 bytes; empty if not found/disabled
}

message ListUsersRequest {}

message UserEntry {
  string username = 1;
  bytes  nt_hash  = 2; // raw 16 bytes
}

message ListUsersReply {
  repeated UserEntry users = 1;
}

// Authorization portion of the Control Plane (Phase 2). Decides whether a
// user may access a share based on the actual Kaimo ACLs. Called by the
// Samba sidecar (kaimo_authd) in the VFS connect hook.
service AuthzService {
  // TREE_CONNECT: may <username> enter the <share> at all?
  // Maps to IAuthenticationLookup.CanAccessShareAsync.
  rpc AuthorizeConnect(AuthorizeConnectRequest) returns (AuthorizeReply);

  // File/path access (Phase 2b). Exact parity with FileService.OpenAsync:
  // write -> CreateWriteData, read -> ListReadData, create -> Parent-Check.
  // Used by the create_file hook (Open) and readdir filter (read-only).
  rpc AuthorizeOpen(AuthorizeOpenRequest) returns (AuthorizeReply);
}

message AuthorizeConnectRequest {
  string username = 1;
  string share    = 2; // Share name (as in Samba/registry), not the GUID
}

message AuthorizeReply {
  bool   allow  = 1;
  string reason = 2; // optional reason for logging (e.g., "unknown share")
}

message AuthorizeOpenRequest {
  string username     = 1;
  string share        = 2;
  string path         = 3; // share-relative, forward slashes
  bool   want_read    = 4; // FILE_READ_DATA requested
  bool   want_write   = 5; // FILE_WRITE_DATA / FILE_APPEND_DATA requested
  bool   wants_create = 6; // create disposition creates new file
}

// Close/Event hooks (Phase 3). Samba performs I/O natively and reports the event
// afterward; .NET handles cross-cutting concerns (versioning, search index,
// ownership) as previously in FileSession.DisposeAsync. Fire-and-forget, best-effort.
service EventService {
  rpc NotifyClose (NotifyCloseRequest)  returns (NotifyReply); // file written and closed
  rpc NotifyMkdir (NotifyPathRequest)   returns (NotifyReply); // directory created
  rpc NotifyDelete(NotifyPathRequest)   returns (NotifyReply); // file/directory deleted
  rpc NotifyRename(NotifyRenameRequest) returns (NotifyReply); // renamed/moved
}

message NotifyCloseRequest {
  string username = 1;
  string share    = 2;
  string path     = 3;
}

message NotifyPathRequest {
  string username     = 1;
  string share        = 2;
  string path         = 3;
  bool   is_directory = 4;
}

message NotifyRenameRequest {
  string username     = 1;
  string share        = 2;
  string old_path     = 3;
  string new_path     = 4;
  bool   is_directory = 5;
}

message NotifyReply { bool ok = 1; }

// Share provisioning (Phase 4). The source of truth remains the Kaimo DB
// (IShareRepository). The ShareControl daemon (kaimo_sharesync -> sync-shares.sh)
// mirrors the enabled shares live into Samba's registry (net conf) so smbd
// offers them without restart. Replaces the former FileSystemWatcher/SyncFromDb()
// from SmbServer.cs.
service ShareService {
  // All enabled shares (name, path, hidden flag) for registry sync.
  rpc ListShares(ListSharesRequest) returns (ListSharesReply);
}

message ListSharesRequest {}

message ShareEntry {
  string name      = 1; // Share name (= registry section, = directory name)
  string path      = 2; // absolute path in container storage
  bool   is_hidden = 3; // IsShareHidden -> browseable = no (ABE: hidden flag only)
}

message ListSharesReply {
  repeated ShareEntry shares = 1;
}

// Protocol/security settings (Phase 4). The source of truth remains the
// Kaimo DB (ISmbConfigStore, maintained via web UI). The config sync
// (kaimo_configsync -> sync-config.sh) mirrors values into Samba's global
// registry config (net conf setparm global). Corresponds to what
// SmbServer.LoadProtocolSettings() fed into the old .NET SMB Server at
// (re)start. WS-Discovery and Audit-Log use separate Samba mechanisms (the `wsdd`
// responder daemon and the `full_audit` VFS module); they are transported as
// booleans here and applied by sync-config.sh (start/stop wsdd; toggle full_audit
// in the global `vfs objects`), not via `server min/max protocol` style globals.
service ConfigService {
  rpc GetProtocolSettings(GetProtocolSettingsRequest) returns (ProtocolSettingsReply);
}

message GetProtocolSettingsRequest {}

message ProtocolSettingsReply {
  // Samba dialect token, directly usable for `server min/max protocol`
  // (SMB2_02, SMB2_10, SMB3_00, SMB3_02, SMB3_11). Mapping from the .NET enum
  // happens in the bridge so the shell remains Samba-agnostic.
  string min_protocol       = 1;
  string max_protocol       = 2;
  bool   require_signing    = 3; // -> server signing = mandatory | auto
  bool   require_encryption = 4; // -> smb encrypt = required | default

  // Phase 5 cutover: the SMB on/off toggle (Datendienste tab -> services.smb.enabled).
  // The old in-process SmbServer was start/stopped by the host reconciler; smbd now
  // lives in a separate container. The authoritative gate is AuthorizeConnect
  // (deny-all when disabled), so a disabled service accepts no TREE_CONNECT. This
  // field lets the config sync log/reflect the state in the Samba container.
  bool   enabled            = 5;

  // Announce the server via WS-Discovery so it shows up in Windows Explorer's
  // "Network" view. Applied by sync-config.sh by starting/stopping the `wsdd`
  // responder daemon (there is no smb.conf parameter for this).
  bool   enable_ws_discovery = 6;

  // Emit structured SMB security-audit events (connect/open/close/rename/unlink…)
  // to the server log. Applied by sync-config.sh by toggling the `full_audit` VFS
  // module in the global `vfs objects` (kaimo_bridge [full_audit]).
  bool   enable_audit_log    = 7;
}

// Snapshots / "Previous Versions" over SMB (Phase 5). Windows requests the list
// of point-in-time versions via FSCTL_SRV_ENUMERATE_SNAPSHOTS and then opens a
// path prefixed with an @GMT- token to read that version. Because Kaimo stores
// versions as gzip-compressed, content-addressed blobs (NOT filesystem snapshot
// dirs), the native vfs_shadow_copy2 cannot serve them; the custom VFS module
// asks this service to enumerate tokens and to materialize a specific version as
// a plain (decompressed) file the module can then serve natively.
// Backed by the already-complete IFileVersionService.
service SnapshotService {
  // FSCTL_SRV_ENUMERATE_SNAPSHOTS: all @GMT- tokens available for <path> in
  // <share> (a file -> that file's versions; "" -> whole share). ACL-filtered:
  // only returned when the user may read the path (ListReadData parity).
  rpc EnumerateSnapshots(EnumerateSnapshotsRequest) returns (EnumerateSnapshotsReply);

  // Materialize one version (decompressed) into a cache file INSIDE the share
  // directory and return its share-relative path + size. The module redirects
  // the @GMT open/stat there and serves it natively (data path stays native,
  // just like live files). Idempotent: an already-materialized version is reused.
  rpc ResolveVersion(ResolveVersionRequest) returns (ResolveVersionReply);
}

message EnumerateSnapshotsRequest {
  string username = 1;
  string share    = 2;
  string path     = 3; // share-relative file/dir the client asked about ("" = share root)
}

message EnumerateSnapshotsReply {
  // "@GMT-YYYY.MM.DD-HH.MM.SS" tokens (as Windows expects them), newest first.
  repeated string gmt_tokens = 1;
}

message ResolveVersionRequest {
  string username  = 1;
  string share     = 2;
  string gmt_token = 3; // "@GMT-..." selecting the version
  string path      = 4; // share-relative path WITHOUT the @GMT- component
}

message ResolveVersionReply {
  bool   found      = 1;
  string cache_path = 2; // share-relative path of the decompressed cache file
  int64  size       = 3;
}
