[global]
    workgroup = WORKGROUP
    server string = Kaimo Samba Spike
    server role = standalone server
    map to guest = never
    log level = 2
    logging = stdout

    # --- Phase-0-Kern: dynamische Shares aus der Registry (net conf) ---
    # smbd liest Shares live aus registry.tdb -> Anlegen/Entfernen ohne Reload/Restart.
    # Ersetzt spaeter den FileSystemWatcher/SyncFromDb-Mechanismus aus SmbServer.cs.
    registry shares = yes
    include = registry

    # SMB2/3 erzwingen (kein SMB1) - wie in der bestehenden SmbProtocolSettings-Konfig.
    server min protocol = SMB2_10

    # Fuer spaetere ABE-Sichtbarkeit (Risiko 2, Option a/c):
    access based share enum = yes
