x-storage-pool-01: &storage-pool-01
  ${LOCATION_STORAGE_01:-./tests/data/storage/pool01}:/data/storage/pool01
x-app-data: &app-data
  ${LOCATION_APP_DATA:-./tests/data/kaimo-system}:/data/kaimo-system
x-logs: &logs
  ${LOCATION_LOGS:-./tests/data/logs}:/data/kaimo-logs

x-bounded-logging: &bounded-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-dotnet-environment: &dotnet-environment
  TZ: ${TZ:-Europe/Berlin}
  KAIMO_LOG_LEVEL: ${KAIMO_LOG_LEVEL:-}
  ConnectionStrings__Default: >-
    Host=kaimo_file_server_db;Database=${POSTGRES_DB:-kaimo_file_server};Username=${POSTGRES_USER:-kaimo_test_user};Password=${POSTGRES_PASSWORD:-change_me}
  LogArchive__RootPath: /data/kaimo-logs
  LogArchive__MaxFileBytes: ${KAIMO_LOG_ARCHIVE_MAX_FILE_BYTES:-10485760}
  LogArchive__RetentionDays: ${KAIMO_LOG_ARCHIVE_RETENTION_DAYS:-14}
  LogArchive__MaxBytesPerSource: ${KAIMO_LOG_ARCHIVE_MAX_SOURCE_BYTES:-262144000}
  NtHash__EncryptionKey: ${NT_HASH_ENCRYPTION_KEY:-}

services:
  # Generates the local mTLS control-plane PKI once. Externally managed
  # production certificates can use the same directory layout.
  kaimo_smb_pki_init:
    image: ${KAIMO_PKI_IMAGE:-kaimosmbpki}
    build:
      context: ./src/samba-vfs
      dockerfile: Dockerfile.pki
    volumes:
      - ${KAIMO_SMB_CONTROL_PKI:-./secrets/smb-control-plane}:/pki
    restart: "no"

  kaimo_file_server.host:
    image: ${KAIMO_HOST_IMAGE:-kaimofileserver}
    container_name: kaimo_file_server
    build:
      context: .
      dockerfile: src/Kaimo_File_Server.Host/Dockerfile
    entrypoint: ["/bin/sh", "-c", "umask 0002 && exec dotnet Kaimo_File_Server.Host.dll"]
    environment:
      <<: *dotnet-environment
      KAIMO_LOG_SOURCE: host
    volumes:
      - *storage-pool-01
      - *app-data
      - *logs
    depends_on:
      kaimo_file_server_db:
        condition: service_healthy
    networks:
      - default
      - kaimo_database

  # Internal, mutually authenticated gRPC control plane for Samba.
  kaimo_smb_bridge:
    image: ${KAIMO_SMB_BRIDGE_IMAGE:-kaimosmbbridge}
    container_name: kaimo_smb_bridge
    build:
      context: .
      dockerfile: src/Kaimo_File_Server.SmbBridge/Dockerfile
    logging: *bounded-logging
    environment:
      <<: *dotnet-environment
      KAIMO_LOG_SOURCE: smb-bridge
      Snapshots__Cache__RootPath: ${KAIMO_SNAPSHOT_CACHE_ROOT:-/data/kaimo-system/.kaimo-snapshots}
      Snapshots__Cache__TtlHours: ${KAIMO_SNAPSHOT_CACHE_TTL_HOURS:-24}
      Snapshots__Cache__MaxBytesPerShare: ${KAIMO_SNAPSHOT_CACHE_MAX_BYTES_PER_SHARE:-5368709120}
      Snapshots__Cache__SweepMinutes: ${KAIMO_SNAPSHOT_CACHE_SWEEP_MINUTES:-30}
      Snapshots__Materialization__MaxFilesPerRequest: ${KAIMO_SNAPSHOT_MAX_FILES:-10000}
      Snapshots__Materialization__MaxBytesPerRequest: ${KAIMO_SNAPSHOT_MAX_REQUEST_BYTES:-1073741824}
      Snapshots__Materialization__MaxConcurrentRequests: ${KAIMO_SNAPSHOT_MAX_CONCURRENT_REQUESTS:-2}
      Snapshots__Materialization__MaxDurationSeconds: ${KAIMO_SNAPSHOT_MAX_DURATION_SECONDS:-25}
      LifecycleEvents__ReceiptRetentionDays: ${KAIMO_EVENT_RECEIPT_RETENTION_DAYS:-30}
    volumes:
      - *storage-pool-01
      - *app-data
      - *logs
      - ${KAIMO_SMB_CONTROL_PKI:-./secrets/smb-control-plane}/bridge:/run/secrets/kaimo-control-plane:ro
    depends_on:
      kaimo_file_server_db:
        condition: service_healthy
      kaimo_smb_pki_init:
        condition: service_completed_successfully
    networks:
      - kaimo_bridge_database
      - kaimo_smb_control

  # Samba owns the native SMB data path; authorization and configuration are
  # supplied by the bridge over the isolated mTLS network.
  kaimo_samba:
    image: ${KAIMO_SAMBA_IMAGE:-kaimosamba}
    container_name: kaimo_samba
    build:
      context: ./src/samba-vfs
      dockerfile: Dockerfile.vfs
    restart: unless-stopped
    logging: *bounded-logging
    dns_search:
      - "."
    ports:
      - "${SAMBA_PORT:-445}:445"
    environment:
      TZ: ${TZ:-Europe/Berlin}
      KAIMO_LOG_SOURCE: samba
      KAIMO_LOG_LEVEL: ${KAIMO_LOG_LEVEL:-}
      KAIMO_LOG_ARCHIVE_ROOT: /data/kaimo-logs
      KAIMO_LOG_ARCHIVE_MAX_FILE_BYTES: ${KAIMO_LOG_ARCHIVE_MAX_FILE_BYTES:-10485760}
      KAIMO_LOG_ARCHIVE_RETENTION_DAYS: ${KAIMO_LOG_ARCHIVE_RETENTION_DAYS:-14}
      KAIMO_LOG_ARCHIVE_MAX_SOURCE_BYTES: ${KAIMO_LOG_ARCHIVE_MAX_SOURCE_BYTES:-262144000}
      KAIMO_BRIDGE_ADDR: kaimo_smb_bridge:5080
      KAIMO_AUTHZ_FAILOPEN: ${KAIMO_AUTHZ_FAILOPEN:-0}
      KAIMO_AUTHD_WORKERS: ${KAIMO_AUTHD_WORKERS:-16}
      KAIMO_AUTHD_QUEUE_CAPACITY: ${KAIMO_AUTHD_QUEUE_CAPACITY:-64}
      KAIMO_AUTHD_IO_TIMEOUT_MS: ${KAIMO_AUTHD_IO_TIMEOUT_MS:-2000}
      KAIMO_VFS_AUTH_TIMEOUT_MS: ${KAIMO_VFS_AUTH_TIMEOUT_MS:-6000}
      KAIMO_VFS_SNAPSHOT_TIMEOUT_MS: ${KAIMO_VFS_SNAPSHOT_TIMEOUT_MS:-32000}
      KAIMO_VFS_EVENT_TIMEOUT_MS: ${KAIMO_VFS_EVENT_TIMEOUT_MS:-250}
      KAIMO_AUTHD_GROUP: kaimo-authd
      KAIMO_AUTHD_PEER_EXECUTABLE: /opt/samba/sbin/smbd
      KAIMO_AUTHD_CACHE_MAX_ENTRIES: ${KAIMO_AUTHD_CACHE_MAX_ENTRIES:-10000}
      KAIMO_AUTHD_CACHE_MAX_BYTES: ${KAIMO_AUTHD_CACHE_MAX_BYTES:-8388608}
      KAIMO_AUTHD_CACHE_TTL_MS: ${KAIMO_AUTHD_CACHE_TTL_MS:-3000}
      KAIMO_EVENT_SPOOL_PATH: /var/lib/kaimo/event-spool
      KAIMO_EVENT_MAX_PENDING: ${KAIMO_EVENT_MAX_PENDING:-100000}
      KAIMO_EVENT_MAX_DEAD: ${KAIMO_EVENT_MAX_DEAD:-10000}
      KAIMO_EVENT_MAX_ATTEMPTS: ${KAIMO_EVENT_MAX_ATTEMPTS:-20}
      KAIMO_EVENT_RETRY_BASE_MS: ${KAIMO_EVENT_RETRY_BASE_MS:-1000}
      KAIMO_EVENT_RETRY_MAX_MS: ${KAIMO_EVENT_RETRY_MAX_MS:-60000}
      KAIMO_USER_SYNC_INTERVAL_SECONDS: ${KAIMO_USER_SYNC_INTERVAL_SECONDS:-60}
      KAIMO_SHARE_SYNC_INTERVAL_SECONDS: ${KAIMO_SHARE_SYNC_INTERVAL_SECONDS:-2}
      KAIMO_CONFIG_SYNC_INTERVAL_SECONDS: ${KAIMO_CONFIG_SYNC_INTERVAL_SECONDS:-2}
      KAIMO_SYNC_HEALTH_MAX_AGE_SECONDS: ${KAIMO_SYNC_HEALTH_MAX_AGE_SECONDS:-180}
      KAIMO_SNAPSHOT_OPENAT: ${KAIMO_SNAPSHOT_OPENAT:-1}
      KAIMO_SNAPSHOT_CACHE_ROOT: ${KAIMO_SNAPSHOT_CACHE_ROOT:-/data/kaimo-system/.kaimo-snapshots}
    volumes:
      - *storage-pool-01
      - *app-data
      - *logs
      - kaimo_samba_event_spool:/var/lib/kaimo/event-spool
      - ${KAIMO_SMB_CONTROL_PKI:-./secrets/smb-control-plane}/samba:/run/secrets/kaimo-control-plane:ro
    tmpfs:
      - /run/kaimo-user-sync:rw,noexec,nosuid,nodev,mode=0700,uid=0,gid=0
    depends_on:
      kaimo_smb_bridge:
        condition: service_started
    networks:
      - default
      - kaimo_smb_control
    healthcheck:
      test: ["CMD-SHELL", "/usr/local/bin/authd-health.sh && /usr/local/bin/smbd-health.sh && /usr/local/bin/sync-health.sh || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 20s

  kaimo_file_server.web:
    image: ${KAIMO_WEB_IMAGE:-kaimofileserverweb}
    container_name: kaimo_file_server_web
    build:
      context: .
      dockerfile: src/Kaimo_File_Server.Web/Dockerfile
    entrypoint: ["/bin/sh", "-c", "umask 0002 && exec dotnet Kaimo_File_Server.Web.dll"]
    ports:
      - "${WEB_HTTP_PORT:-8081}:8080"
      - "${WEB_HTTPS_PORT:-8443}:8443"
    environment:
      <<: *dotnet-environment
      KAIMO_LOG_SOURCE: web
      Jwt__Secret: ${JWT_SECRET:-}
      GOOGLE_APPLICATION_CREDENTIALS: /data/logins/google-service-account.json
    volumes:
      - *storage-pool-01
      - *app-data
      - *logs
      - ${LOCATION_GDRIVE_CREDENTIALS:-./tests/data/logins/google-service-account.json}:/data/logins/google-service-account.json:ro
    depends_on:
      kaimo_file_server_db:
        condition: service_healthy
      kaimo_file_server.host:
        condition: service_started
    networks:
      - default
      - kaimo_database

  kaimo_file_server_db:
    image: postgres:${POSTGRES_VERSION:-17-alpine}
    container_name: kaimo_file_server_db
    environment:
      TZ: ${TZ:-Europe/Berlin}
      POSTGRES_DB: ${POSTGRES_DB:-kaimo_file_server}
      POSTGRES_USER: ${POSTGRES_USER:-kaimo_test_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    volumes:
      - ${LOCATION_DB:-./tests/data/postgres}:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 10
    networks:
      - kaimo_database
      - kaimo_bridge_database

  adminer:
    image: adminer:${ADMINER_VERSION:-latest}
    restart: always
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    networks:
      - default
      - kaimo_database

networks:
  kaimo_smb_control:
    internal: true
  kaimo_database:
    internal: true
  kaimo_bridge_database:
    internal: true

volumes:
  kaimo_samba_event_spool:
