x-vol-storage-pool-01: &vol-storage-pool-01 ${LOCATION_STORAGE_01:-./tests/data/storage/pool01}:/data/storage/pool01
x-vol-storage-pool-02: &vol-storage-pool-02 ${LOCATION_STORAGE_02:-./tests/data/storage/pool02}:/data/storage/pool02
x-vol-app-data: &vol-app-data               ${LOCATION_APP_DATA:-./tests/data/kaimo-system}:/data/kaimo-system
x-bounded-logging: &bounded-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # One-shot bootstrap for local development. It creates the complete mTLS PKI
  # on the first Compose start and becomes a no-op when all files already exist.
  # Externally managed production PKI can use the same directory layout.
  kaimo_smb_pki_init:
    image: ${DOCKER_REGISTRY-}kaimosmbpki
    build:
      context: ./src/samba-vfs
      dockerfile: Dockerfile.pki
    volumes:
      - ${KAIMO_SMB_CONTROL_PKI:-./secrets/smb-control-plane}:/pki
    restart: "no"

  kaimo_file_server.host:
    image: ${DOCKER_REGISTRY-}kaimofileserver
    container_name: kaimo_file_server
    # umask 002 -> newly created files become 0664 (group-writable) so that the
    # Samba side (group kaimo) can overwrite them. Fallback for filesystems without ACL
    # support (drvfs/9p on Windows dev machine); on ext4 the default ACLs from the
    # Samba entrypoint handle this. See src/samba-vfs/README.md (Storage Ownership).
    entrypoint: ["/bin/sh", "-c", "umask 0002 && exec dotnet Kaimo_File_Server.Host.dll"]
    volumes:
      - *vol-storage-pool-01
      #- *vol-storage-pool-02
      - *vol-app-data
    depends_on:
      kaimo_file_server_db:
        condition: service_healthy
      #elasticsearch:
      #  condition: service_healthy
    build:
      context: .
      dockerfile: src/Kaimo_File_Server.Host/Dockerfile
    networks:
      - default
      - kaimo_database

  # Samba gRPC control plane. It is reachable only from Samba through the
  # dedicated internal control network and requires mutually authenticated TLS.
  kaimo_smb_bridge:
    image: ${DOCKER_REGISTRY-}kaimosmbbridge
    container_name: kaimo_smb_bridge
    logging: *bounded-logging
    build:
      context: .
      dockerfile: src/Kaimo_File_Server.SmbBridge/Dockerfile
    depends_on:
      kaimo_file_server_db:
        condition: service_healthy
      kaimo_smb_pki_init:
        condition: service_completed_successfully
    environment:
      # Global internal cache, outside every configured share path.
      # Must match KAIMO_SNAPSHOT_CACHE_ROOT in the Samba container.
      Snapshots__Cache__RootPath: ${KAIMO_SNAPSHOT_CACHE_ROOT:-/data/kaimo-system/.kaimo-snapshots}
      # P1-09: preflight and runtime bounds for eager folder projections.
      # Keep the duration below KAIMO_VFS_SNAPSHOT_TIMEOUT_MS.
      Snapshots__Materialization__MaxFilesPerRequest: ${KAIMO_SNAPSHOT_MAX_FILES:-10000}
      Snapshots__Materialization__MaxBytesPerRequest: ${KAIMO_SNAPSHOT_MAX_REQUEST_BYTES:-1073741824}
      Snapshots__Materialization__MaxConcurrentRequests: ${KAIMO_SNAPSHOT_MAX_CONCURRENT_REQUESTS:-2}
      Snapshots__Materialization__MaxDurationSeconds: ${KAIMO_SNAPSHOT_MAX_DURATION_SECONDS:-25}
      # P1-11: completed event IDs remain long enough to deduplicate delayed
      # sidecar retries across bridge/database restarts.
      LifecycleEvents__ReceiptRetentionDays: ${KAIMO_EVENT_RECEIPT_RETENTION_DAYS:-30}
    volumes:
      - *vol-storage-pool-01
      #- *vol-storage-pool-02
      - *vol-app-data
      # Mount only the server identity and public client CA. Client private
      # keys are available exclusively in the Samba container.
      - ${KAIMO_SMB_CONTROL_PKI:-./secrets/smb-control-plane}/bridge:/run/secrets/kaimo-control-plane:ro
    networks:
      - kaimo_bridge_database
      - kaimo_smb_control

  # Real Samba (smbd) + custom VFS module (kaimo_bridge) — the SMB protocol layer
  # since the Phase 5 cutover. It fully replaces the former in-process .NET SMB
  # server (removed with the Kaimo_File_Server.Smb project); Samba owns port 445.
  # Auth/ACLs/versioning/shares/protocol settings and @GMT "Previous Versions" run
  # through the gRPC control plane (kaimo_smb_bridge); the data path stays native.
  # Details: src/samba-vfs/README.md and docu/smb-samba-vfs-migration.md
  kaimo_samba:
    image: ${DOCKER_REGISTRY-}kaimosamba
    container_name: kaimo_samba
    logging: *bounded-logging
    # Neutralize search domain inherited from host (e.g., home.lab). Otherwise the
    # gRPC C++ client (c-ares, NOT glibc/NSS) appends it to the bridge service name
    # -> asks "kaimo_smb_bridge.home.lab" -> Docker forwards to LAN DNS,
    # which resolves unknown names via wildcard to wrong LAN IP ->
    # "Connection refused". "." = empty search domain, so only the bare
    # service name remains, which the embedded Docker DNS (127.0.0.11) resolves correctly.
    dns_search:
      - "."
    ports:
      - 445:445
    volumes:
      - *vol-storage-pool-01
      #- *vol-storage-pool-02
      - *vol-app-data
      # P1-11: survives Samba container recreation, not only process restarts.
      - kaimo_samba_event_spool:/var/lib/kaimo/event-spool
      # Mount the single Samba workload identity and public control-plane CA.
      - ${KAIMO_SMB_CONTROL_PKI:-./secrets/smb-control-plane}/samba:/run/secrets/kaimo-control-plane:ro
    build:
      context: ./src/samba-vfs
      dockerfile: Dockerfile.vfs
    depends_on:
      - kaimo_smb_bridge
    environment:
      # Address of gRPC bridge for NT hash sync (kaimo_authsync).
      KAIMO_BRIDGE_ADDR: kaimo_smb_bridge:5080
      # Authz fail mode when the bridge/authd is unreachable. Default is fail-CLOSED
      # (deny) so a bridge outage cannot silently grant access. Set to "1" to fail
      # OPEN (allow on error) only if availability must trump security in a given env.
      KAIMO_AUTHZ_FAILOPEN: "0"
      # P1-01: fixed authd concurrency and bounded accepted-client queue.
      # Silent local clients lose their worker after the I/O deadline.
      KAIMO_AUTHD_WORKERS: ${KAIMO_AUTHD_WORKERS:-16}
      KAIMO_AUTHD_QUEUE_CAPACITY: ${KAIMO_AUTHD_QUEUE_CAPACITY:-64}
      KAIMO_AUTHD_IO_TIMEOUT_MS: ${KAIMO_AUTHD_IO_TIMEOUT_MS:-2000}
      # P1-05: absolute VFS-side budgets cover local connect + complete frame
      # send + complete response read. Events use a separate short enqueue budget.
      KAIMO_VFS_AUTH_TIMEOUT_MS: ${KAIMO_VFS_AUTH_TIMEOUT_MS:-6000}
      KAIMO_VFS_SNAPSHOT_TIMEOUT_MS: ${KAIMO_VFS_SNAPSHOT_TIMEOUT_MS:-32000}
      KAIMO_VFS_EVENT_TIMEOUT_MS: ${KAIMO_VFS_EVENT_TIMEOUT_MS:-250}
      # P1-04: private local control socket. Synced Samba users receive this as
      # a secondary group; authd additionally verifies SO_PEERCRED + smbd inode.
      KAIMO_AUTHD_GROUP: kaimo-authd
      KAIMO_AUTHD_PEER_EXECUTABLE: /opt/samba/sbin/smbd
      # P1-02: bounded LRU authorization cache. TTL is also the documented
      # maximum ACL-revocation delay for an already cached open decision.
      KAIMO_AUTHD_CACHE_MAX_ENTRIES: ${KAIMO_AUTHD_CACHE_MAX_ENTRIES:-10000}
      KAIMO_AUTHD_CACHE_MAX_BYTES: ${KAIMO_AUTHD_CACHE_MAX_BYTES:-8388608}
      KAIMO_AUTHD_CACHE_TTL_MS: ${KAIMO_AUTHD_CACHE_TTL_MS:-3000}
      # P1-11: durable lifecycle queue. A VFS event is acknowledged locally only
      # after its fsync+rename publication. Failed gRPC deliveries back off and
      # eventually move to the bounded dead-letter directory.
      KAIMO_EVENT_SPOOL_PATH: /var/lib/kaimo/event-spool
      KAIMO_EVENT_MAX_PENDING: ${KAIMO_EVENT_MAX_PENDING:-100000}
      KAIMO_EVENT_MAX_DEAD: ${KAIMO_EVENT_MAX_DEAD:-10000}
      KAIMO_EVENT_MAX_ATTEMPTS: ${KAIMO_EVENT_MAX_ATTEMPTS:-20}
      KAIMO_EVENT_RETRY_BASE_MS: ${KAIMO_EVENT_RETRY_BASE_MS:-1000}
      KAIMO_EVENT_RETRY_MAX_MS: ${KAIMO_EVENT_RETRY_MAX_MS:-60000}
      # P1-10: maximum polling delay before a disabled/deleted share is removed
      # from Samba and all of its active tree connections are force-closed.
      KAIMO_SHARE_SYNC_INTERVAL_SECONDS: ${KAIMO_SHARE_SYNC_INTERVAL_SECONDS:-2}
      # @GMT "Previous Versions" data-path redirect (openat hook). "1" = on (serve the
      # materialized version copy). Set to "0" to disable the redirect at runtime
      # (no rebuild) if it ever misbehaves; timewarp opens then fail closed.
      KAIMO_SNAPSHOT_OPENAT: "1"
      # Must match Snapshots__Cache__RootPath in kaimo_smb_bridge. This internal
      # directory is outside all share pools and is never published by Samba.
      KAIMO_SNAPSHOT_CACHE_ROOT: ${KAIMO_SNAPSHOT_CACHE_ROOT:-/data/kaimo-system/.kaimo-snapshots}
    networks:
      - default
      - kaimo_smb_control
    healthcheck:
      test: ["CMD-SHELL", "/opt/samba/bin/smbclient -L localhost -U kaimotest%Passw0rd! -m SMB3 >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 20s

  kaimo_file_server.web:
    image: ${DOCKER_REGISTRY-}kaimofileserverweb
    container_name: kaimo_file_server_web
    ports:
      - 8081:8080
      - 8443:8443
    environment:
      TZ: Europe/Berlin
      GOOGLE_APPLICATION_CREDENTIALS: /tests/data/logins/google-service-account.json
        
    # umask 002 -> new files 0664 (group-writable) so that Samba side
    # (group kaimo) can overwrite them. Fallback for filesystems without ACL support
    # (drvfs/9p, Windows dev); on ext4 the default ACLs from the
    # Samba entrypoint handle this. See src/samba-vfs/README.md (Storage Ownership).
    entrypoint: ["/bin/sh", "-c", "umask 0002 && exec dotnet Kaimo_File_Server.Web.dll"]
    volumes:
      - *vol-storage-pool-01
      #- *vol-storage-pool-02
      - *vol-app-data
      - ${LOCATION_GDRIVE_CREDENTIALS:-./tests/data/logins/google-service-account.json}:/data/logins/google-service-account.json:ro
      
    depends_on:
      kaimo_file_server_db:
        condition: service_healthy
      kaimo_file_server.host:
        condition: service_started
      #elasticsearch:
      #  condition: service_healthy
    build:
      context: .
      dockerfile: src/Kaimo_File_Server.Web/Dockerfile
    networks:
      - default
      - kaimo_database

  kaimo_file_server_db:
    container_name: kaimo_file_server_db
    image: postgres:17-alpine
    environment:
      TZ: Europe/Berlin
      POSTGRES_DB: kaimo_file_server
      POSTGRES_USER: kaimo_test_user
      POSTGRES_PASSWORD: change_me
    volumes:
      - ${LOCATION_DB:-./tests/data/postgres}:/var/lib/postgresql/data
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kaimo_test_user -d kaimo_file_server"]
      interval: 2s
      timeout: 5s
      retries: 10
    networks:
      - kaimo_database
      - kaimo_bridge_database
      
  #elasticsearch:
  #  container_name: kaimo_elasticsearch
  #  image: docker.elastic.co/elasticsearch/elasticsearch:9.4.2
