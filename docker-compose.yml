services:
  kaimo_file_server.host:
    image: ${DOCKER_REGISTRY-}kaimofileserver
    container_name: kaimo_file_server
    #user: root
    #ports:
    #  - 445:445
    volumes:
      - ./tests/data/storage:/data/storage
    depends_on:
      kaimo_file_server_db:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    build:
      context: .
      dockerfile: src/Kaimo_File_Server.Host/Dockerfile

  # Phase 1: gRPC-Control-Plane fuer Samba. Liefert (vorerst) NT-Hashes der
  # Kaimo-Benutzer aus der DB, damit Samba NTLMv2 lokal pruefen kann.
  # Nur intern erreichbar (kein Port nach aussen), h2c auf :5080.
  kaimo_smb_bridge:
    image: ${DOCKER_REGISTRY-}kaimosmbbridge
    container_name: kaimo_smb_bridge
    build:
      context: .
      dockerfile: src/Kaimo_File_Server.SmbBridge/Dockerfile
    depends_on:
      kaimo_file_server_db:
        condition: service_healthy
    volumes:
      - ./tests/data/storage:/data/storage

  # Phase-0-Spike: echtes Samba (smbd) + eigenes VFS-Modul (kaimo_bridge).
  # Laeuft PARALLEL zur bestehenden .NET-SMB-Implementierung im Host-Container.
  # Port 445 bleibt vorerst beim .NET-Host; Samba wird waehrend der Migration
  # auf Host-Port 1445 gemappt. Beim Cutover (Phase 5) uebernimmt Samba die 445.
  # Details: samba-vfs/README.md und docu/smb-samba-vfs-migration.md
  kaimo_samba:
    image: ${DOCKER_REGISTRY-}kaimosamba
    container_name: kaimo_samba
    ports:
      - 445:445
    volumes:
      # Gleicher Storage wie Host/Web -> Samba macht die Datei-I/O direkt.
      - ./tests/data/storage:/data/storage
    build:
      context: ./samba-vfs
      dockerfile: Dockerfile.vfs
    depends_on:
      - kaimo_smb_bridge
    environment:
      # Adresse der gRPC-Bridge fuer den NT-Hash-Sync (kaimo_authsync).
      KAIMO_BRIDGE_ADDR: kaimo_smb_bridge:5080
    healthcheck:
      test: ["CMD-SHELL", "/opt/samba/bin/smbclient -L localhost -U kaimotest%Passw0rd! -m SMB3 >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 20s

  kaimo_file_server.web:
    image: ${DOCKER_REGISTRY-}kaimofileserverweb
    container_name: kaimo_file_server_web
    ports:
      - 8081:8080
      - 8443:8443
    environment:
      TZ: Europe/Berlin
    volumes:
      - ./tests/data/storage:/data/storage
    depends_on:
      kaimo_file_server_db:
        condition: service_healthy
      kaimo_file_server.host:
        condition: service_started
      elasticsearch:
        condition: service_healthy
    build:
      context: .
      dockerfile: src/Kaimo_File_Server.Web/Dockerfile

  kaimo_file_server_db:
    container_name: kaimo_file_server_db
    image: postgres:17-alpine
    environment:
      TZ: Europe/Berlin
      POSTGRES_DB: kaimo_file_server
      POSTGRES_USER: kaimo_test_user
      POSTGRES_PASSWORD: change_me
    volumes:
      - ./tests/data/postgres:/var/lib/postgresql/data
    ports:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kaimo_test_user -d kaimo_file_server"]
      interval: 2s
      timeout: 5s
      retries: 10
      
  elasticsearch:
    container_name: kaimo_elasticsearch
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    environment:
      TZ: Europe/Berlin
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms2g -Xmx2g"
      # Dev-Maschine: Festplatte darf voller werden, bevor ES das Zuweisen von
      # Shards blockiert. Standard ist 85/90/95% -> bei einer fast vollen C:
      # bleibt sonst jeder Shard "unassigned" und der Cluster wird rot.
      cluster.routing.allocation.disk.watermark.low: "95%"
      cluster.routing.allocation.disk.watermark.high: "97%"
      cluster.routing.allocation.disk.watermark.flood_stage: "98%"
    volumes:
      - ./tests/data/elasticsearch:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsSL http://localhost:9200/_cluster/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15
      
      # Reserve Memory Addresses for files straight away. Elastic search loads up files on demand later on 
      # sudo sysctl -w vm.max_map_count=262144
      # echo "vm.max_map_count=262144" | sudo tee -a /etc/sysctl.conf
      #  
      # give permissions to folder:
      # sudo chown -R 1000:1000 ./tests/data/elasticsearch
  
  
  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080
  

