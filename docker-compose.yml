  #    - ${LOCATION_ES:-./tests/data/elastic_search}:/usr/share/elasticsearch/data
  #  ports:
  #    - "9200:9200"
  #  healthcheck:
  #    test: ["CMD-SHELL", "curl -fsSL 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=1s' || exit 1"]
  #    interval: 5s
  #    timeout: 5s
  #    retries: 30
  #    start_period: 30s

      # Reserve Memory Addresses for files straight away. Elastic search loads up files on demand later on 
      # sudo sysctl -w vm.max_map_count=262144
      # echo "vm.max_map_count=262144" | sudo tee -a /etc/sysctl.conf
      #  
      # give permissions to folder:
      # sudo chown -R 1000:1000 ./tests/data/elasticsearch-9.4
  
  
  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080
    networks:
      - default
      - kaimo_database
networks:
  # No unrelated application service is attached to the gRPC control plane.
  kaimo_smb_control:
    internal: true
  # The bridge reaches PostgreSQL without joining the general application net.
  kaimo_database:
    internal: true
  # Point-to-point trust segment: only PostgreSQL and the SMB bridge join it.
  # Web/Adminer cannot route to the bridge through their DB segment.
  kaimo_bridge_database:
    internal: true

volumes:
  kaimo_samba_event_spool:
