      # give permissions to folder:
      # sudo chown -R 1000:1000 ./tests/data/elasticsearch-9.4
  
  
  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080
    networks:
      - default
      - kaimo_database
networks:
  # No unrelated application service is attached to the gRPC control plane.
  kaimo_smb_control:
    internal: true
  # The bridge reaches PostgreSQL without joining the general application net.
  kaimo_database:
    internal: true
  # Point-to-point trust segment: only PostgreSQL and the SMB bridge join it.
  # Web/Adminer cannot route to the bridge through their DB segment.
  kaimo_bridge_database:
    internal: true
